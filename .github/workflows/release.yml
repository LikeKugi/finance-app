name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag matches Cargo version
        shell: pwsh
        run: |
          $metadata = cargo +stable metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $_.name -eq 'finance-app' })
          if ($packages.Count -ne 1) {
            throw "Expected exactly one finance-app package in Cargo metadata"
          }

          $version = $packages[0].version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $($env:GITHUB_REF_NAME) must match Cargo version v$version"
          }
          "FINANCE_APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Locate DirectX shader compiler
        shell: pwsh
        run: |
          $fxcRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $fxc = Get-ChildItem -Path $fxcRoot -Filter fxc.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1

          if (-not $fxc) {
            throw "fxc.exe was not found in the Windows SDK at $fxcRoot"
          }

          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      - name: Build release executable
        run: cargo +stable build -p finance-app --release --locked

      - name: Build debug executable
        run: cargo +stable build -p finance-app --locked

      - name: Verify Windows executable version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = [version]"$($env:FINANCE_APP_VERSION).0"
          $versionInfo = (Get-Item 'target/release/finance-app.exe').VersionInfo
          if ($versionInfo.FileVersion -ne $env:FINANCE_APP_VERSION -or
              $versionInfo.ProductVersion -ne $env:FINANCE_APP_VERSION -or
              $versionInfo.FileMajorPart -ne $expected.Major -or
              $versionInfo.FileMinorPart -ne $expected.Minor -or
              $versionInfo.FileBuildPart -ne $expected.Build -or
              $versionInfo.FilePrivatePart -ne 0 -or
              $versionInfo.ProductMajorPart -ne $expected.Major -or
              $versionInfo.ProductMinorPart -ne $expected.Minor -or
              $versionInfo.ProductBuildPart -ne $expected.Build -or
              $versionInfo.ProductPrivatePart -ne 0) {
            throw "Windows VERSIONINFO does not match Cargo version $($env:FINANCE_APP_VERSION)"
          }

      - name: Verify Windows PE subsystems
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PeSubsystem([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              if ($peOffset -lt 0 -or ($peOffset + 94) -gt $stream.Length) {
                throw "Invalid PE header in $Path"
              }

              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "PE signature was not found in $Path"
              }

              $stream.Position = $peOffset + 24 + 68
              return $reader.ReadUInt16()
            } finally {
              $stream.Dispose()
            }
          }

          $releaseSubsystem = Get-PeSubsystem 'target/release/finance-app.exe'
          if ($releaseSubsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2) for release, got $releaseSubsystem"
          }

          $debugSubsystem = Get-PeSubsystem 'target/debug/finance-app.exe'
          if ($debugSubsystem -ne 3) {
            throw "Expected Windows console subsystem (3) for debug, got $debugSubsystem"
          }

      - name: Stage release executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/finance-app.exe dist/finance-app.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: finance-app-windows-x64
          path: dist/finance-app.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo +stable metadata --no-deps --format-version 1 --locked |
            python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "finance-app"))')"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            printf 'Cargo app version must be MAJOR.MINOR.PATCH; got %s\n' "$version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Release tag %s must match Cargo app version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          echo "FINANCE_APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build release executable
        run: cargo +stable build -p finance-app --release --locked

      - name: Package and verify macOS app
        shell: bash
        run: |
          set -euo pipefail

          architecture="${{ matrix.architecture }}"
          version="$FINANCE_APP_VERSION"

          bundle="dist/FinanceApp.app"
          archive="dist/finance-app-macos-${architecture}.zip"
          mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"
          install -m 755 target/release/finance-app "$bundle/Contents/MacOS/finance-app"
          cp crates/app/Info.plist "$bundle/Contents/Info.plist"
          cp assets/icons/icon.icns "$bundle/Contents/Resources/icon.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$bundle/Contents/Info.plist"

          plutil -lint "$bundle/Contents/Info.plist"
          test -x "$bundle/Contents/MacOS/finance-app"
          test -s "$bundle/Contents/Resources/icon.icns"
          test "$(uname -m)" = "$architecture"
          test "$(lipo -archs "$bundle/Contents/MacOS/finance-app")" = "$architecture"

          ditto -c -k --sequesterRsrc --keepParent "$bundle" "$archive"
          unpacked="$RUNNER_TEMP/FinanceApp-${architecture}"
          mkdir -p "$unpacked"
          ditto -x -k "$archive" "$unpacked"

          unpacked_bundle="$unpacked/FinanceApp.app"
          unpacked_plist="$unpacked_bundle/Contents/Info.plist"
          plutil -lint "$unpacked_plist"
          test -x "$unpacked_bundle/Contents/MacOS/finance-app"
          test -s "$unpacked_bundle/Contents/Resources/icon.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$unpacked_plist")" = finance-app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$unpacked_plist")" = app.finance.financeapp
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$unpacked_plist")" = APPL
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$unpacked_plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$unpacked_plist")" = "$version"
          test "$(lipo -archs "$unpacked_bundle/Contents/MacOS/finance-app")" = "$architecture"

      - name: Upload macOS app archive
        uses: actions/upload-artifact@v4
        with:
          name: finance-app-macos-${{ matrix.architecture }}
          path: dist/finance-app-macos-${{ matrix.architecture }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: finance-app-*
          path: dist
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/finance-app.exe
          test -f dist/finance-app-macos-arm64.zip
          test -f dist/finance-app-macos-x86_64.zip
          assets=(dist/*)
          if [[ ${#assets[@]} -ne 3 ]]; then
            printf 'Expected exactly three release assets, found %s\n' "${#assets[@]}" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: FinanceApp ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/finance-app.exe
            dist/finance-app-macos-arm64.zip
            dist/finance-app-macos-x86_64.zip