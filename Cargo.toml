[workspace]
members = [
    "crates/db",
    "crates/ui",
    "crates/app",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
directories = "6"
eframe = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"